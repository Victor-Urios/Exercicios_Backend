server:
  port: 8082

spring:
  application:
    name: product-service

  data:
    mongodb:
      host: localhost
      port: 27017
      database: productdb
logging:
  level:
    root: INFO
    br.com.nebulastar.productservice: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
