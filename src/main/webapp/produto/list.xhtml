<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<f:view>
	<h:head>
		<h:outputStylesheet>
            th, td {
                text-align: center;
            }

            h3 {
                margin-top: 0;
                text-align: center;
            }

            input[type="text"] {
                width: 100%;
                box-sizing: border-box;
                -webkit-box-sizing:border-box;
                -moz-box-sizing: border-box;
            }

        </h:outputStylesheet>
	</h:head>
	<h:body>
		<p:outputPanel>
			<h3>Produtos cadastrados</h3>
			<div class="ui-g">
				<div class="ui-g-2" />
				<div class="ui-g-8">
					<h:form id="products">
						<p:growl id="growl" sticky="true" />

						<p:dataTable id="productList" var="product"
							value="#{produtoController.produtos}">
							<p:column headerText="Id">
								<h:outputText value="#{product.id}" />
							</p:column>

							<p:column headerText="Nome">
								<h:outputText id="nomeInput" value="#{product.nome}" />
							</p:column>

							<p:column headerText="Quantidade">
								<h:outputText id="qntInput" value="#{product.quantidade}" />
							</p:column>

							<p:column headerText="Valor">
								<h:outputText id="valorInput" value="#{product.preco}" />
							</p:column>

							<p:column>
								<p:commandButton update="productList add" value="Editar"
									icon="ui-icon-closethick"
									action="#{produtoController.edit(product)}"
									styleClass="ui-icon-pencil">
								</p:commandButton>
							</p:column>
							<p:column>
								<p:commandButton update="productList" value="Delete"
									icon="ui-icon-closethick"
									action="#{produtoController.delete(product)}"
									styleClass="ui-priority-primary">
									<p:confirm header="Atenção" message="Deseja realmente deletar este produto?" icon="pi pi-exclamation-triangle"/>
								</p:commandButton>
							</p:column>
						</p:dataTable>
						<br />
						<p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
				            <p:commandButton value="Sim" type="button" styleClass="ui-confirmdialog-yes" style="margin-left: 96px;" />
				            <p:commandButton value="Não" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
				        </p:confirmDialog>
					</h:form>
				</div>
				<div class="ui-g-2"></div>
			</div>
			<h3>Criar novo Produto</h3>
			<div class="ui-g">
				<div class="ui-g-2"></div>
				<div class="ui-g-8">
					<h:form id="add">
						<h:panelGrid columns="3" cellpadding="5" style="margin: 0 auto;">
						
							<p:outputLabel for="nome" value="Nome" />
							<p:inputText id="nome" value="#{produtoController.produto.nome}" required="true" />
							<p:message for="nome" />
							
							<p:outputLabel for="cdb" value="CDB" />
							<p:inputText id="cdb"
								value="#{produtoController.produto.cdb}" 
								size="10" maxlength="10" required="true" />
							<p:message for="cdb" />
							
	
							<p:outputLabel for="quantidade" value="Quantidade" />
							<p:inputText id="quantidade"
								value="#{produtoController.produto.quantidade}" required="true">
							</p:inputText>
							<p:message for="quantidade" />

							<p:outputLabel for="preco" value="Preço" />
							<p:inputText id="preco"
								value="#{produtoController.produto.preco}" required="true">
							</p:inputText>
							<p:message for="preco" />
							
							<p:outputLabel for="desc" value="Descrição" />
							<p:inputText id="desc"
								value="#{produtoController.produto.descricao}" required="true">
							</p:inputText>
							<p:message for="desc" />
						

							<p:commandButton update="@form :products:productList"
								value="Cadastrar" action="#{produtoController.add}"
								rendered="#{!produtoController.isUpdate}">
							</p:commandButton>
							<p:commandButton update="@form :products:productList"
								value="Atualizar" action="#{produtoController.update}"
								rendered="#{produtoController.isUpdate}">
							</p:commandButton>
							<p:commandButton update="add"
								value="Cancelar" action="#{produtoController.cancel}"
								immediate="true">
								<f:ajax render="add" resetValues="true"/>
							</p:commandButton>
						</h:panelGrid>
						<!-- <h:messages errorStyle="color:red;margin:8px;"></h:messages> -->
					</h:form>
				</div>
				<div class="ui-g-2"></div>
			</div>
		</p:outputPanel>
	</h:body>
</f:view>
</html>
